<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVERYDAY JEWELRY | Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>

    <header class="navbar">
    <div class="logo">
      <p class="brand">EVERYDAY JEWELRY</P>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT US</a></li>
        <li><a href="collection.html">COLLECTION</a></li>
        <li><a href="shop.html">SHOP</a></li>
        <li><a href="contact.html">CONTACT US</a></li>
      </ul>
    </nav>
  </header>


  <section class="title-box">
    <p class="eyebrow center">Get In Touch</p>
    <h1 class="title">We'd Love<br>to Hear From You</h1>
    <p class="text center">
      Got a question about an order, a piece, or just want to say hi?
      Drop us a message and we'll get back to you within 24 hours.
    </p>
  </section>

  <section class="reach-wrap">

  <div class="reach-image">
    <img src="images/4801c650b1af4c2da5dedde2c1e01e69.jpg" alt="Model wearing">
  </div>

  <div class="reach-form">
    <form>
      <div class="field">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Your name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell us more..."></textarea>
      </div>

      <button type="submit" class="cta-btn btn-full">Send</button>
    </form>
  </div>

</section>



</body>
</html>
