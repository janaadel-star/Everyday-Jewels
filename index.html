<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everyday Jewels | Login or Register</title>
    <link rel="stylesheet" href="login-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <!-- النصف الأيسر: صورة أو خلفية جمالية مريحة للعين -->
        <div class="login-image-side">
            <div class="brand-overlay">
                <h2>Everyday Jewels</h2>
                <p>Elevate Your Look, Every Single Day.</p>
            </div>
        </div>

        <!-- النصف الأيمن: الفورم (اللوج إن) -->
        <div class="login-form-side">
            <div class="form-wrapper">
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Please enter your details to sign in.</p>
                </div>

                <form>
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <div class="form-actions">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-pass">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-login">Sign In</button>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? <a href="#">Create new account</a></p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
