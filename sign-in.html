<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>EVERYDAY JEWELRY | Create Account</title>
   <link rel="icon" href="images/icon j.jpg">
   <link rel="stylesheet" href="Css/style.css">
   <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <main class="create-account-main">

        <section class="create-account-section">

            <div class="create-account-header">
                <h2>Create Account</h2>
            </div>

            <div class="create-account">

                <form>
                    
                    <div class="data">
                        <label for="Name">Name</label>
                        <input type="text" id="Name" name="Name" placeholder="Enter your name" required>
                    </div>

                    <div class="data">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>

                    <div class="data">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Minimum 6 characters" min-length="6" required>
                    </div>

                    <div class="data">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                    </div>

                    <div class="checkbox">
                        <input type="checkbox" name="terms" required> 
                        <label>I agree to the Terms & Conditions</label>
                    </div>

                    <a href="index.html" class="signin">Create Account</a>

                </form>

        </section>

    </main>

</body>
</html>
